name: Build and deploy

on:
  schedule:
    # UTC. GitHub may start a scheduled run a few minutes late.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  build-and-deploy:
    concurrency:
      group: smartmoney-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Project name is smartmoney. smartmoney.pages.dev is already taken, so
      # the production hostname may be a different *.pages.dev subdomain.
      PROJECT_NAME: smartmoney
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN GitHub Actions secret."
            exit 1
          fi
          CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Using CLOUDFLARE_ACCOUNT_ID secret."
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          else
            echo "CLOUDFLARE_ACCOUNT_ID secret is empty. Resolving the account from the API token."
            export PYTHONUNBUFFERED=1
            unset CLOUDFLARE_ACCOUNT_ID
            auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Accept: application/json")
            curl -sS "https://api.cloudflare.com/client/v4/accounts?per_page=50" "${auth[@]}" -o /tmp/cf-accounts.json
            curl -sS "https://api.cloudflare.com/client/v4/memberships?per_page=50" "${auth[@]}" -o /tmp/cf-memberships.json
            curl -sS -D /tmp/cf-verify.hdr "https://api.cloudflare.com/client/v4/user/tokens/verify" "${auth[@]}" -o /tmp/cf-verify.json
            python - <<'PY'
          import json, os, re, urllib.request
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          def load(path):
              try:
                  return json.load(open(path, encoding="utf-8"))
              except Exception as e:
                  print(path, "unreadable", e)
                  return {}
          def grab(obj, found):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      m = re.search(r"com\.cloudflare\.api\.account\.([a-f0-9]{32})", str(k))
                      if m: found.append(m.group(1))
                      if k in ("account_id", "accountId") and re.fullmatch(r"[a-f0-9]{32}", str(v or "")):
                          found.append(v)
                      acct = v.get("account") if isinstance(v, dict) else None
                      if isinstance(acct, dict) and re.fullmatch(r"[a-f0-9]{32}", str(acct.get("id") or "")):
                          found.append(acct["id"])
                      if k == "id" and isinstance(obj.get("name"), str) and re.fullmatch(r"[a-f0-9]{32}", str(v or "")):
                          found.append(v)
                      grab(v, found)
              elif isinstance(obj, list):
                  for v in obj: grab(v, found)
          v = load("/tmp/cf-verify.json")
          vr = v.get("result") if isinstance(v.get("result"), dict) else {}
          print("Token verify success:", bool(v.get("success")), "status:", (vr or {}).get("status"), "keys:", sorted((vr or {}).keys()), "errors:", v.get("errors"))
          found = []
          accounts = load("/tmp/cf-accounts.json")
          print("GET /accounts success:", accounts.get("success"), "result_info:", accounts.get("result_info"), "errors:", accounts.get("errors"))
          grab(accounts.get("result"), found)
          mem = load("/tmp/cf-memberships.json")
          print("GET /memberships success:", mem.get("success"), "errors:", mem.get("errors"))
          grab(mem.get("result"), found)
          hdr = open("/tmp/cf-verify.hdr", encoding="utf-8", errors="replace").read()
          for line in hdr.splitlines():
              if re.search(r"account|cf-", line, re.I) and "report-to" not in line.lower():
                  print("verify header:", line[:180])
                  found += re.findall(r"\b[a-f0-9]{32}\b", line)
          tid = (vr or {}).get("id")
          if tid and re.fullmatch(r"[a-f0-9-]{8,}", str(tid)):
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/user/tokens/{tid}",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      detail = json.loads(r.read().decode())
                  print("GET /user/tokens/{id} success:", detail.get("success"), "errors:", detail.get("errors"))
                  grab(detail.get("result"), found)
              except Exception as e:
                  body = e.read().decode("utf-8", "replace")[:300] if hasattr(e, "read") else ""
                  print("GET /user/tokens/{id} failed:", e, body)
          found = list(dict.fromkeys(found))
          print(f"Discovered {len(found)} account id(s).")
          if len(found) != 1:
              raise SystemExit(
                  "CLOUDFLARE_API_TOKEN is active, but CLOUDFLARE_ACCOUNT_ID is empty and this "
                  "Pages token cannot list accounts. Set the secret to the 32-character account id "
                  "(the same account that owns the pmscan Pages project, if this token is for that account)."
              )
          open(os.environ["GITHUB_ENV"], "a", encoding="utf-8").write(f"CLOUDFLARE_ACCOUNT_ID={found[0]}\n")
          print("Using the only account visible to this token.")
          PY
          fi

      - name: Build site
        run: |
          set -o pipefail
          python -u build.py | tee build.log
          grep -E 'charts: [1-9][0-9]* price histories, [1-9][0-9]* trades' build.log
          grep -E 'Done: Macro [0-9]+ traders, [1-9][0-9]* markets shown -> index.html' build.log
          grep -E 'live trades: [1-9][0-9]* rows from [1-9][0-9]* wallets' build.log
          python - <<'PY'
          import json, pathlib, re, sys
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          m = re.search(r"/\*__LIVE_START__\*/(\[.*\])/\*__LIVE_END__\*/", html)
          if not m:
              sys.exit("Live Trades payload missing from index.html")
          rows = json.loads(m.group(1))
          if not rows:
              sys.exit("Live Trades payload is empty")
          bad = [r for r in rows if not r.get("t") or not str(r.get("url", "")).startswith("https://polymarket.com/event/")]
          if bad:
              sys.exit(f"{len(bad)} live rows missing a real market title or Polymarket link")
          r = rows[0]
          print(f"embed ok: {len(rows)} rows; newest {r.get('n')} {r.get('side')} {r.get('out')} ${r.get('usd')} {r.get('chip')} {r.get('split')} {r.get('arrow')}")
          PY

      - name: Stage dist
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          test -s dist/index.html
          # Deploy this file only. raw.json, data.json, and debug.json stay on the runner.
          find dist -type f -print

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create Pages project if missing
        run: |
          set +e
          out=$(npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch main 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            if printf '%s\n' "$out" | grep -Eiq 'already exists|already taken by this account|project already exists'; then
              echo "Project already exists; continuing."
            else
              echo "Failed to create Pages project (exit ${code})."
              exit "$code"
            fi
          fi

      - name: Deploy index.html to Cloudflare Pages
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true \
            --commit-hash="${GITHUB_SHA}" | tee deploy.log
          python - <<'PY'
          import json, os, re, urllib.request
          log = open("deploy.log", encoding="utf-8", errors="replace").read()
          urls = re.findall(r"https://[a-z0-9.-]+\.pages\.dev", log)
          acct = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          name = os.environ["PROJECT_NAME"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{acct}/pages/projects/{name}",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/json"})
          prod = ""
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  d = json.loads(r.read().decode())
              project = d.get("result") or {}
              sub = project.get("subdomain") or ""
              domains = [x.get("name") if isinstance(x, dict) else x for x in (project.get("domains") or [])]
              canon = ((project.get("canonical_deployment") or {}).get("url")) or ""
              print("Pages subdomain:", sub)
              print("Pages domains:", ", ".join(str(x) for x in domains if x) or "(none)")
              if canon:
                  print("Canonical deployment:", canon)
              if sub:
                  prod = f"https://{sub}" if str(sub).startswith("http") else f"https://{sub}.pages.dev" if not str(sub).endswith(".pages.dev") else f"https://{sub}"
          except Exception as e:
              print("Could not read the Pages project:", e)
          if not prod and urls:
              prod = urls[-1]
          print("Production URL:", prod or "(unknown)")
          for u in urls:
              print("Deploy log URL:", u)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary and prod:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write(f"Live site: {prod}\n")
          PY

  schedule-next:
    needs: build-and-deploy
    if: success()
    runs-on: ubuntu-latest
    concurrency:
      group: smartmoney-refresh
      cancel-in-progress: true
    steps:
      - name: Queue the next refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Scheduled runs were landing hours apart. Wait, then start the next deploy."
          sleep 540
          gh api --method POST "repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" -f ref=main
