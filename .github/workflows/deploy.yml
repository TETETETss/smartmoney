name: Build and deploy

on:
  schedule:
    # GitHub runs this in UTC. About every 20 minutes; the scheduler can lag.
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: smartmoney-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # smartmoney.pages.dev is flagged by Cloudflare as phishing, so the
      # project (and its *.pages.dev hostname) is bramspm-smartmoney.
      PROJECT_NAME: bramspm-smartmoney
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID GitHub Actions secret."
            exit 1
          fi
          echo "Cloudflare credentials are present."

      - name: Build site
        run: |
          python -u build.py | tee build.log
          grep -E 'charts: [1-9][0-9]* price histories, [1-9][0-9]* trades' build.log
          grep -E 'Done: Macro [0-9]+ traders, [1-9][0-9]* markets shown -> index.html' build.log

      - name: Stage dist
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          test -s dist/index.html
          # Deploy this file only. raw.json, data.json, and debug.json stay on the runner.
          find dist -type f -print

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create Pages project if missing
        run: |
          set +e
          out=$(npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch main 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            if printf '%s\n' "$out" | grep -Eiq 'already exists'; then
              echo "Project already exists; continuing."
            else
              echo "Failed to create Pages project (exit ${code})."
              exit "$code"
            fi
          fi

      - name: Deploy index.html to Cloudflare Pages
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true \
            --commit-hash="${GITHUB_SHA}"
          echo "Production URL: https://${PROJECT_NAME}.pages.dev"
