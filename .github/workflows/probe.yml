name: probe
on:
  push:
    branches: [claude-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          D=https://data-api.polymarket.com
          for L in 50 100 200; do echo "-- all limit $L"; curl -s "$D/v2/leaderboard?time_period=all&limit=$L" | jq -c '(.data|length), .pagination.has_more'; done
          C=$(curl -s "$D/v2/leaderboard?time_period=all&limit=100" | jq -r '.pagination.next_cursor')
          echo "-- cursor page"; curl -s "$D/v2/leaderboard?time_period=all&limit=100&cursor=$C" | jq -c '(.data|length), .data[0].rank, .pagination.has_more'
          echo "-- offset 100"; curl -s "$D/v2/leaderboard?time_period=all&limit=100&offset=100" | jq -c '(.data|length), .data[0].rank'
          echo "-- offset 2000"; curl -s "$D/v2/leaderboard?time_period=all&limit=100&offset=2000" | jq -c '(.data|length), .data[0].rank'
          echo "-- cat politics"; curl -s "$D/v2/leaderboard?time_period=month&limit=100&category=politics" | jq -c '(.data|length), ([.data[]|select(.x_username!="")]|length)'
          echo "-- order vol"; curl -s "$D/v2/leaderboard?time_period=month&limit=100&order_by=VOL" | jq -c '(.data|length)'
          echo "-- deep cursor"; c=""; n=0; for i in $(seq 1 30); do r=$(curl -s "$D/v2/leaderboard?time_period=all&limit=100${c:+&cursor=$c}"); k=$(echo "$r"|jq '.data|length'); x=$(echo "$r"|jq '[.data[]|select(.x_username!="")]|length'); n=$((n+x)); c=$(echo "$r"|jq -r '.pagination.next_cursor // empty'); echo -n "$k/$x "; [ -z "$c" ] && break; done; echo " total x=$n"
